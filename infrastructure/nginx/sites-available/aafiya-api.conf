# ==============================================================================
# AAFIYA PLATFORM — BACKEND API VIRTUAL HOST (LARAVEL 13 REST API)
# Domain: api.aafiya.dz
# ==============================================================================

# 1. HTTP -> HTTPS Permanent Redirection (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name api.aafiya.dz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure API Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aafiya.dz;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/api.aafiya.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aafiya.dz/privkey.pem;

    # Include Shared Security & SSL Parameters
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # Document Root (Laravel Public Directory)
    root /var/www/aafiya/backend/public;
    index index.php;

    # Access & Error Logging
    access_log /var/log/nginx/aafiya-api.access.log;
    error_log /var/log/nginx/aafiya-api.error.log warn;

    # Upload Limits (Radiology Reports & Lab Attachments)
    client_max_body_size 10M;

    # Standard Laravel Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI PHP-FPM Execution
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY ""; # Mitigate HTTPOXY vulnerability
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files and temporary scripts
    location ~* (composer\.(json|lock)|package\.(json|lock)|phpunit\.xml|\.md|\.log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
