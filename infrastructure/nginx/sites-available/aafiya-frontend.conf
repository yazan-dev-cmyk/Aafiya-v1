# ==============================================================================
# AAFIYA PLATFORM — FRONTEND VIRTUAL HOST (NEXT.JS 15 APP ROUTER)
# Domain: aafiya.dz (and www.aafiya.dz)
# ==============================================================================

# 1. HTTP -> HTTPS Permanent Redirection (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name aafiya.dz www.aafiya.dz;

    # ACME Challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Reverse Proxy (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aafiya.dz www.aafiya.dz;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/aafiya.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aafiya.dz/privkey.pem;

    # Include Shared Security & SSL Parameters
    include /etc/nginx/conf.d/ssl-params.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # Root Directory for Static Assets
    root /var/www/aafiya/frontend/public;

    # Access & Error Logging
    access_log /var/log/nginx/aafiya-frontend.access.log;
    error_log /var/log/nginx/aafiya-frontend.error.log warn;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (_next/static)
    location /_next/static/ {
        alias /var/www/aafiya/frontend/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Directory Assets (images, fonts, icons)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @nextjs_upstream;
    }

    # Reverse Proxy to Standalone Next.js Node Server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Named fallback upstream
    location @nextjs_upstream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
