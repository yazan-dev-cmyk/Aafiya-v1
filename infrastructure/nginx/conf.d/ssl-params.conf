# ==============================================================================
# AAFIYA PLATFORM — SSL/TLS 1.2 & 1.3 HARDENED PARAMETERS
# Project: Aafiya — Unified National Digital Health Platform
# Workstream: P20-O5 Production Infrastructure
# ==============================================================================

# [TLS DECISION IMPLEMENTATION]
# Option A (Recommended for Broad National Healthcare Compatibility): TLSv1.2 + TLSv1.3
# Option B (Strict Modern Security): Uncomment the strict line below to enforce TLSv1.3 ONLY.
ssl_protocols TLSv1.2 TLSv1.3;
# ssl_protocols TLSv1.3; # [UNCOMMENT FOR STRICT TLS 1.3 ONLY POLICY]

# High-Entropy Modern Cipher Suites
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# SSL Session Optimization & Ticket Protection
ssl_session_cache shared:AafiyaSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling for Fast Certificate Verification
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
