# ==============================================================================
# AAFIYA PLATFORM — ENTERPRISE NGINX SECURITY HEADERS CONFIGURATION
# Project: Aafiya — Unified National Digital Health Platform
# Workstream: P20-O5 Production Infrastructure
# ==============================================================================

# Protect against MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent Clickjacking by denying embedding in iframes
add_header X-Frame-Options "DENY" always;

# Legacy XSS Filter protection
add_header X-XSS-Protection "1; mode=block" always;

# Strict Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict sensitive browser APIs & hardware features
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# HTTP Strict Transport Security (HSTS) - 2 years with subdomains
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
