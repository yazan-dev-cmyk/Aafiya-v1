# ==============================================================================
# AAFIYA PLATFORM — SUPERVISOR QUEUE WORKER DAEMON CONFIGURATION
# Project: Aafiya — Unified National Digital Health Platform
# Workstream: P20-O5 Production Infrastructure
# ==============================================================================

[program:aafiya-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aafiya/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/aafiya-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
priority=999
